apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ include "powersync-helm-chart-demo.fullname" . }}-replication
    {{- include "powersync-helm-chart-demo.labels" . | nindent 4 }}
  name: {{ include "powersync-helm-chart-demo.fullname" . }}-replication
  namespace: {{ .Values.namespace }}
spec:
  # Warm-standby: replicas: 2 runs an active replicator + a standby that waits
  # for the sync-rules lock. Only one actively replicates at any time. Older
  # service versions log PSYNC_S1003 noisily on the standby — set replicas: 1
  # and strategy: Recreate in those cases.
  replicas: {{ .Values.replication.replicas }}
  selector:
    matchLabels:
      app: {{ include "powersync-helm-chart-demo.fullname" . }}-replication
  strategy:
    {{- toYaml .Values.replication.strategy | nindent 4 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: default
      labels:
        app: {{ include "powersync-helm-chart-demo.fullname" . }}-replication
    spec:
      {{- if .Values.replication.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ include "powersync-helm-chart-demo.fullname" . }}-replication
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - args:
            - start
            - -r
            - sync
          env:
            - name: NODE_OPTIONS
              value: {{ .Values.replication.nodeOptions }}
          envFrom:
            - configMapRef:
                name: {{ include "powersync-helm-chart-demo.fullname" . }}-base-env
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5
          livenessProbe:
            exec:
              command:
                - cat
                - /app/.probes/poll
            failureThreshold: 5
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 30
          name: default
          ports:
            - containerPort: 9464
              name: metrics
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - cat
                - /app/.probes/ready
            failureThreshold: 5
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 30
          resources:
            {{- toYaml .Values.replication.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - cat
                - /app/.probes/startup
            failureThreshold: 200
            initialDelaySeconds: 1
            periodSeconds: 1
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /powersync/config
              name: config-volume
            - mountPath: /powersync/sync_rules
              name: sync-rules-volume
      volumes:
        - name: config-volume
          secret:
            defaultMode: 420
            secretName: {{ include "powersync-helm-chart-demo.fullname" . }}-config
        - configMap:
            defaultMode: 420
            name: {{ include "powersync-helm-chart-demo.fullname" . }}-sync-rules
          name: sync-rules-volume
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ include "powersync-helm-chart-demo.fullname" . }}
    {{- include "powersync-helm-chart-demo.labels" . | nindent 4 }}
  name: {{ include "powersync-helm-chart-demo.fullname" . }}-api
  namespace: {{ .Values.namespace }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "powersync-helm-chart-demo.fullname" . }}-api
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: default
      labels:
        app: {{ include "powersync-helm-chart-demo.fullname" . }}-api
    spec:
      containers:
        - args:
            - start
            - -r
            - api
          env:
            - name: NODE_OPTIONS
              value: {{ .Values.api.nodeOptions }}
          envFrom:
            - configMapRef:
                name: {{ include "powersync-helm-chart-demo.fullname" . }}-base-env
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5
          livenessProbe:
            exec:
              command:
                - cat
                - /app/.probes/poll
            failureThreshold: 5
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 30
          name: default
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9464
              name: metrics
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - cat
                - /app/.probes/ready
            failureThreshold: 5
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - cat
                - /app/.probes/startup
            failureThreshold: 200
            initialDelaySeconds: 1
            periodSeconds: 1
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /powersync/config
              name: config-volume
      volumes:
        - name: config-volume
          secret:
            defaultMode: 420
            secretName: {{ include "powersync-helm-chart-demo.fullname" . }}-config
