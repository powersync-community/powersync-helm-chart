apiVersion: v1
kind: Secret
metadata:
  name: {{ include "powersync-helm-chart-demo.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  annotations:
    # Mounted by the migrate Job (pre-install/pre-upgrade hook with weight -5),
    # so this Secret must be created earlier in the hook chain.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  # Config is JSON that gets converted to base64
  config.json: {{ toJson .Values.powersyncConfig | b64enc }}