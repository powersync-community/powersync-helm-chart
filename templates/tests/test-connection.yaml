apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "powersync-helm-chart-demo.fullname" . }}-test-connection"
  labels:
    {{- include "powersync-helm-chart-demo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox
      # The Service exposes port 80 (mapped to container port 8080). Hit any path —
      # exit code 0 means the API is at least answering HTTP.
      command: ['wget']
      args:
        - "-q"
        - "-O-"
        - "--tries=1"
        - "--timeout=10"
        - {{ printf "http://%s/probes/liveness" (include "powersync-helm-chart-demo.fullname" .) | quote }}
  restartPolicy: Never
