apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "powersync-helm-chart-demo.fullname" . }}-sync-streams
  namespace: {{ .Values.namespace }}
data:
  streams.yaml: |-
    {{ .Values.syncStreams.data | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "powersync-helm-chart-demo.fullname" . }}-base-env
  namespace: {{ .Values.namespace }}
  annotations:
    # envFrom'd by the migrate Job (pre-install/pre-upgrade hook with weight -5),
    # so this ConfigMap must be created earlier in the hook chain.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}